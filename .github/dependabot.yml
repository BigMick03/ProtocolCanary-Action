version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Dependabot's github-actions ecosystem understands SHA-pinned `uses:`
  # references with a trailing `# vX` comment, so it can keep bumping the
  # pin (and the comment) as upstream releases new versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github_actions"
