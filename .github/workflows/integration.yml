name: Integration (live)

# Exercises the real three-repository pipeline end to end: this Action,
# the real Protocol-Canary CLI (built from source), the real
# StellarCanary/ProtocolCanary-Fixtures Protocol 28 pack, and a live
# Stellar Testnet RPC endpoint. This is intentionally separate from
# ci.yml: Testnet availability must never be a prerequisite for the
# ordinary unit-test workflow that gates pull requests.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout ProtocolCanary-Fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          path: fixtures

      - name: Run Stellar Protocol Canary (this Action, from source)
        uses: ./
        with:
          protocol: "28"
          fixtures-dir: fixtures/protocol-28
          network: testnet
          rpc-url: https://soroban-testnet.stellar.org
